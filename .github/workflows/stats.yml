name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats

          USER="fjfahim74"

          REPOS=$(gh api "users/$USER" --jq '.public_repos')
          FOLLOWERS=$(gh api "users/$USER" --jq '.followers')
          FOLLOWING=$(gh api "users/$USER" --jq '.following')

          cat > stats/github-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="250">
            <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d"/>

            <text x="30" y="45"
              font-family="Arial"
              font-size="22"
              font-weight="bold"
              fill="#58a6ff">
              Fahim's GitHub Stats
            </text>

            <text x="40" y="95"
              font-family="Arial"
              font-size="15"
              fill="#8b949e">
              PUBLIC REPOSITORIES
            </text>

            <text x="40" y="125"
              font-family="Arial"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              $REPOS
            </text>

            <text x="240" y="95"
              font-family="Arial"
              font-size="15"
              fill="#8b949e">
              FOLLOWERS
            </text>

            <text x="240" y="125"
              font-family="Arial"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              $FOLLOWERS
            </text>

            <text x="430" y="95"
              font-family="Arial"
              font-size="15"
              fill="#8b949e">
              FOLLOWING
            </text>

            <text x="430" y="125"
              font-family="Arial"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              $FOLLOWING
            </text>

            <text x="40" y="180"
              font-family="Arial"
              font-size="15"
              fill="#8b949e">
              GITHUB
            </text>

            <text x="40" y="210"
              font-family="Arial"
              font-size="18"
              font-weight="bold"
              fill="#58a6ff">
              github.com/fjfahim74
            </text>
          </svg>
          EOF

      - name: Upload stats to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --single-branch --branch output \
            https://x-access-token:${GH_TOKEN}@github.com/fjfahim74/fjfahim74.git output

          cp stats/github-stats.svg output/github-stats.svg

          cd output
          git add github-stats.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
