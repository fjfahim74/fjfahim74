
name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats

          USER="fjfahim74"

          REPOS=$(gh api "users/$USER" --jq '.public_repos')
          FOLLOWERS=$(gh api "users/$USER" --jq '.followers')
          FOLLOWING=$(gh api "users/$USER" --jq '.following')

          COMMITS=$(gh api --paginate "search/commits?q=author:$USER" \
            --jq '.total_count' | head -1)

          cat > stats/github-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220">
            <style>
              .title { font: 600 20px Arial, sans-serif; fill: #58a6ff; }
              .label { font: 600 15px Arial, sans-serif; fill: #8b949e; }
              .value { font: 700 22px Arial, sans-serif; fill: #f0f6fc; }
              .box { fill: #0d1117; stroke: #30363d; }
            </style>

            <rect x="1" y="1" width="493" height="218" rx="10" class="box"/>

            <text x="25" y="38" class="title">Fahim's GitHub Stats</text>

            <text x="30" y="78" class="label">Repositories</text>
            <text x="30" y="105" class="value">$REPOS</text>

            <text x="180" y="78" class="label">Followers</text>
            <text x="180" y="105" class="value">$FOLLOWERS</text>

            <text x="330" y="78" class="label">Following</text>
            <text x="330" y="105" class="value">$FOLLOWING</text>

            <text x="30" y="145" class="label">Commits</text>
            <text x="30" y="172" class="value">$COMMITS</text>

            <text x="180" y="145" class="label">GitHub Profile</text>
            <text x="180" y="172" class="value">@fjfahim74</text>

            <text x="30" y="202" class="label">Keep coding. Keep building. 🚀</text>
          </svg>
          EOF

      - name: Publish stats
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
